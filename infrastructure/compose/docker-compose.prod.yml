# =============================================================================
# Travix AI — Production Override
#
# Extends docker-compose.yml for production deployments.
#
# Usage:
#   docker compose \
#     -f infrastructure/compose/docker-compose.yml \
#     -f infrastructure/compose/docker-compose.prod.yml \
#     up -d
#
# Security posture:
#   - Database and Redis ports are NOT exposed on the host — only the API port
#     is exposed, and in most production setups it sits behind a reverse proxy
#   - All secrets are injected via environment variables (CI/CD secrets or a
#     secrets manager) — this file contains NO real values
#   - No bind mounts — the production image is fully self-contained
#   - restart: always ensures containers recover from unexpected exits
#
# Secrets:
#   Configure the following environment variables in your CI/CD pipeline or
#   secrets manager before deploying:
#     DATABASE_URL, DATABASE_SYNC_URL, REDIS_URL
#     SECRET_KEY, JWT_SECRET_KEY
#     AI_API_KEY (when AI_PROVIDER != mock)
#     MAPS_SERVER_API_KEY, MAPS_CLIENT_API_KEY
#     EMAIL_API_KEY
#     STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY
#
#   See .env.example for the complete list of required variables.
# =============================================================================

version: "3.9"

services:

  # --------------------------------------------------------------------------
  # PostgreSQL — NOT exposed on the host in production.
  # The API container reaches it via the internal travix-net network.
  # --------------------------------------------------------------------------
  postgres:
    restart: always

  # --------------------------------------------------------------------------
  # Redis — NOT exposed on the host in production.
  # AOF fsync is elevated to "always" in production for maximum durability of
  # the token revocation list (DB 2). The performance trade-off is acceptable
  # for the security guarantee on production workloads.
  # --------------------------------------------------------------------------
  redis:
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --loglevel
      - warning

  # --------------------------------------------------------------------------
  # Travix API — production image
  #
  # The image tag is set at deploy time, e.g.:
  #   API_IMAGE=ghcr.io/travix-ai/api:v1.2.3 docker compose ... up -d
  #
  # Port 8000 is exposed but should sit behind a reverse proxy (nginx, Traefik,
  # AWS ALB, etc.) — not accessed directly by clients.
  # --------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:?API_IMAGE must be set to the production image tag}
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:?DATABASE_SYNC_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_API_KEY: ${AI_API_KEY:-}
      MAPS_PROVIDER: ${MAPS_PROVIDER:?MAPS_PROVIDER is required}
      MAPS_SERVER_API_KEY: ${MAPS_SERVER_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?STORAGE_PROVIDER is required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:?NOTIFICATION_PROVIDER is required}
