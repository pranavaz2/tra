# =============================================================================
# Travix AI — CI Pipeline
#
# Runs on every pull request and push to main.
# Enforces code quality, runs tests, and validates migrations.
#
# TODO: Activate job steps as each app is initialized:
#   - api-lint, api-test: activate after apps/api is bootstrapped
#   - mobile-lint, mobile-test: activate after apps/mobile is bootstrapped
#   - migration-check: activate after first Alembic migration is created
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  FLUTTER_CHANNEL: "stable"

jobs:

  # ===========================================================================
  # PRE-COMMIT — Runs hooks against all changed files
  # ===========================================================================
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # ===========================================================================
  # API — Python linting and type checking
  # ===========================================================================
  api-lint:
    name: API — Lint & type check
    runs-on: ubuntu-latest
    # TODO: Remove `if: false` once apps/api is initialized
    if: false
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff (linter)
        run: ruff check .

      - name: Run Black (format check)
        run: black --check --line-length 100 .

      - name: Run isort (import order check)
        run: isort --check-only --profile black --line-length 100 .

      # TODO: Enable mypy once type stubs are configured
      # - name: Run mypy (type checker)
      #   run: mypy app/

  # ===========================================================================
  # API — Python tests
  # ===========================================================================
  api-test:
    name: API — Tests
    runs-on: ubuntu-latest
    # TODO: Remove `if: false` once apps/api and tests are initialized
    if: false
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: travix_test
          POSTGRES_USER: travix
          POSTGRES_PASSWORD: travix_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://travix:travix_test_password@localhost:5432/travix_test
      DATABASE_SYNC_URL: postgresql+psycopg2://travix:travix_test_password@localhost:5432/travix_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      AI_PROVIDER: mock
      MAPS_PROVIDER: mock
      STORAGE_PROVIDER: mock
      EMAIL_PROVIDER: mock
      NOTIFICATION_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/api/coverage.xml
          flags: api

  # ===========================================================================
  # MOBILE — Flutter linting
  # ===========================================================================
  mobile-lint:
    name: Mobile — Lint & analyze
    runs-on: ubuntu-latest
    # TODO: Remove `if: false` once apps/mobile is initialized
    if: false
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run dart analyze
        run: flutter analyze --fatal-infos

      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed lib/ test/

  # ===========================================================================
  # MOBILE — Flutter tests
  # ===========================================================================
  mobile-test:
    name: Mobile — Tests
    runs-on: ubuntu-latest
    # TODO: Remove `if: false` once apps/mobile is initialized
    if: false
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/mobile/coverage/lcov.info
          flags: mobile

  # ===========================================================================
  # MIGRATION CHECK — Validate Alembic migrations are consistent
  # ===========================================================================
  migration-check:
    name: Database — Migration consistency
    runs-on: ubuntu-latest
    # TODO: Remove `if: false` once apps/api and first migration are created
    if: false
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: travix_migration_check
          POSTGRES_USER: travix
          POSTGRES_PASSWORD: travix_migration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_SYNC_URL: postgresql+psycopg2://travix:travix_migration_password@localhost:5432/travix_migration_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply all migrations
        run: alembic upgrade head

      - name: Check for unapplied schema changes
        run: |
          alembic check
          echo "All migrations are consistent with the current models."
