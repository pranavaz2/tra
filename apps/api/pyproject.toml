[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# =============================================================================
# Project metadata
# =============================================================================

[project]
name = "travix-api"
version = "0.1.0"
description = "Travix AI — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# =============================================================================
# Runtime dependencies
# =============================================================================

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0,<1.0.0",

    # ASGI servers
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "gunicorn>=23.0.0,<24.0.0",

    # Data validation
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",

    # Database — async ORM + migrations
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",         # Async PostgreSQL driver (application)
    "psycopg2-binary>=2.9.10,<3.0.0", # Sync PostgreSQL driver (Alembic migrations)
    "alembic>=1.14.0,<2.0.0",

    # Redis — async client
    "redis[hiredis]>=5.2.0,<6.0.0",

    # Async task queue
    "arq>=0.26.0,<1.0.0",

    # HTTP client (internal service calls, external APIs)
    "httpx>=0.28.0,<1.0.0",

    # Password hashing — Argon2id (see ADR-004)
    "argon2-cffi>=23.1.0,<25.0.0",

    # JWT — access token creation and validation (see ADR-003)
    # [cryptography] extra included for future RS256 migration path (ADR-003 §Migration).
    "PyJWT[cryptography]>=2.9.0,<3.0.0",

    # Structured logging
    "python-json-logger>=3.2.0,<4.0.0",

    # Error tracking
    "sentry-sdk[fastapi]>=2.19.0,<3.0.0",
]

# =============================================================================
# Optional dependency groups
# =============================================================================

[project.optional-dependencies]

dev = [
    # Testing
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "anyio[trio]>=4.7.0,<5.0.0",
    "httpx>=0.28.0,<1.0.0",  # AsyncClient for FastAPI testing

    # Code quality
    "black>=24.10.0,<27.0.0",
    "ruff>=0.8.0,<1.0.0",
    "isort>=5.13.0,<9.0.0",
    "mypy>=1.13.0,<3.0.0",

    # Type stubs
    "types-redis>=4.6.0",
]

# =============================================================================
# Tool configuration
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "ANN401", # Dynamically typed expressions (Any) — sometimes necessary
    "S101",   # Use of `assert` — acceptable in tests
    "B008",   # Do not perform function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]  # Relaxed rules in tests
"migrations/**/*.py" = ["ANN"]  # Alembic migrations don't need full type hints

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require PostgreSQL + Redis)",
    "slow: Tests that take more than 2 seconds",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",       # Application factory — tested via integration
    "migrations/*",      # Alembic migrations
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
fail_under = 80
