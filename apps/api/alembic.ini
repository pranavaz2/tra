# =============================================================================
# Travix AI — Alembic Configuration
#
# The database URL is NOT set here. It is injected from environment variables
# in migrations/env.py via app.config.get_settings().
#
# Run migrations from apps/api/:
#   alembic upgrade head                   → apply all pending migrations
#   alembic revision --autogenerate -m ""  → draft a new migration
#   alembic downgrade -1                   → roll back one migration
#   alembic history                        → show migration history
#   alembic check                          → verify schema matches models (CI gate)
#
# IMPORTANT: Never edit an existing migration file after it has been merged.
# Always create a new migration. See CLAUDE.md Section 10.
# =============================================================================

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = migrations

# Prepend the current directory to sys.path so `from app.xxx import ...` works
prepend_sys_path = .

# File name format for generated migration files
# Produces: 2025_01_15_0001_add_trips_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for the creation timestamp in migration files
timezone = UTC

# The sqlalchemy.url is left empty — configured programmatically in env.py
sqlalchemy.url =

# Truncate long revision messages in history display
truncate_slug_length = 40

# Revision environment
version_path_separator = os

# Output encoding
output_encoding = utf-8


# =============================================================================
# Logging configuration (used by Alembic CLI only, not by the application)
# =============================================================================

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
